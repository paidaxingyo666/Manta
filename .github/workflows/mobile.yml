name: Mobile Checks

on:
  # Why: the checks are only advisory on a pull request — this repository has no
  # branch protection, so a sync can merge with them red, and one did. Running on
  # main as well means a merge that broke mobile says so within the hour rather
  # than at the next release.
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - 'src/shared/terminal-file-link-conformance.ts'
      - '.github/workflows/mobile.yml'
      - '.github/workflows/mobile-ios-release.yml'
      - '.github/actions/install-node-dependencies/**'
  # Why no `paths:` here, unlike the push trigger: `Mobile Checks` is a required
  # status check on main. A workflow skipped by a path filter creates no check at
  # all, so every pull request that does not touch mobile waits forever on a
  # context that will never appear — which blocked one. A job skipped by its own
  # `if:` does create the check, and branch protection counts it as passing, so
  # the filtering moves from the trigger down to the job below.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  changes:
    name: detect mobile changes
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # blob:none: the merge-base diff needs full history but no old blobs.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Classify changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ]; then
            echo "mobile=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: a rename reported name-only can hide the source path.
          CHANGED="$(git diff --name-only --no-renames --diff-filter=ACDMR --merge-base "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$CHANGED"
          # The same patterns the push trigger filters on: mobile itself, the
          # shared fixtures its terminal link parsers are conformance-tested
          # against, the two workflows whose Fastfile nothing else loads, and the
          # install action this job runs.
          if printf '%s\n' "$CHANGED" | grep -Eq '^(mobile/|src/shared/terminal-file-link-conformance\.ts$|\.github/workflows/mobile(\.yml|-ios-release\.yml)$|\.github/actions/install-node-dependencies/)'; then
            echo "mobile=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "mobile=false" | tee -a "$GITHUB_OUTPUT"
          fi

  verify:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.mobile == 'true'
    # Why a display name: pr.yml's gate job is also `verify`, and two jobs with
    # one context name are one required check to branch protection — a red
    # mobile run hid behind a green desktop one.
    name: Mobile Checks
    runs-on: ubuntu-latest

    env:
      # Why: an unfrozen bundler silently re-resolves when Gemfile.lock drifts
      # from the Gemfile, which is how the release jobs could land on different
      # fastlane versions in the first place. Fail here instead.
      BUNDLE_FROZEN: 'true'

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Why the root install: the mobile typecheck imports shared types from
      # ../src/shared, whose runtime deps (tweetnacl, ws) resolve from the
      # repo-root node_modules. The action installs them with --ignore-scripts.
      - uses: ./.github/actions/install-node-dependencies
        with:
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      # bundler-cache installs mobile/Gemfile.lock, so this job is also what
      # proves the pinned fastlane the release workflow depends on still
      # resolves — before a release run finds out.
      - name: Setup Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: mobile

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test iOS release version resolution
        run: ruby fastlane/ios_release_version_test.rb

      - name: Test TestFlight lane arguments
        run: ruby fastlane/fastfile_testflight_arguments_test.rb

      # Why: nothing else in CI loads the Fastfile, so a syntax error, a broken
      # require, or an undefined constant only surfaces mid-release — the
      # ios-distribute job failed every run for six days that way. `lanes` just
      # loads and lists, so it needs no App Store Connect credentials and makes
      # no network calls to Apple.
      - name: Smoke-check the Fastfile
        env:
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
        run: bundle exec fastlane lanes

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check
