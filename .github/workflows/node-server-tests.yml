name: Headless Node server

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'config/**'
      - 'native/**'
      - 'tests/**'
      - 'resources/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - '.npmrc'
      - '.pnpmfile.cjs'
      - '.github/actions/install-node-dependencies/**'
      - '.github/workflows/node-server-tests.yml'
  # The pull request qualifies one platform for an unflavoured change; this is where all six
  # are re-qualified, so a platform break surfaces minutes after merge instead of next cron.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - 'native/**'
      - 'tests/**'
      - 'resources/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - '.npmrc'
      - '.pnpmfile.cjs'
      - '.github/actions/install-node-dependencies/**'
      - '.github/workflows/node-server-tests.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * *'

permissions:
  contents: read

concurrency:
  group: node-server-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.scope.outputs.should_run }}
      qualification: ${{ steps.scope.outputs.qualification }}
      runners: ${{ steps.scope.outputs.runners }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - name: Detect headless-server build and test inputs
        id: scope
        shell: bash
        run: |
          # Compare the tested merge with its base, retaining both sides of renames.
          if git diff --name-only --no-renames -z HEAD^1 HEAD > "$RUNNER_TEMP/node-server-changes"; then
            node config/scripts/node-server-change-scope.mjs "$RUNNER_TEMP/node-server-changes"
          else
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
          fi

  persistence:
    needs: changes
    # Missing/failed detection runs the full matrix; manual runs remain unconditional.
    # A draft carries no platform verdict; readiness re-triggers this workflow. Spelled against
    # the event name so the push and schedule paths do not rest on a null property comparison.
    if: >-
      ${{ !cancelled() && needs.changes.outputs.should_run != 'false' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true) }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.runners || '["ubuntu-22.04","ubuntu-24.04-arm","macos-14","macos-15-intel","windows-2022","windows-11-arm"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MANTA_BACKGROUND_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: ${{ runner.os == 'Windows' && 'node' || 'none' }}
      # Before setup-node 18: the scripts import the TypeScript runtime pin.
      # Linux release slots come from the Ubuntu 20.04 and Alpine lanes below, where their libc
      # floors live; this runner's slot only packages mantad for its own tests.
      - name: Build and smoke this runner's node-pty prebuild slot under the pinned Node
        shell: bash
        run: |
          pnpm build:mantad-prebuilds
          pnpm build:mantad-prebuilds --require-slots "$(node config/scripts/build-mantad-prebuilds.mjs --print-slot)"
          pnpm build:mantad-prebuilds --smoke
      - run: pnpm build:mantad
      # Design D7 upgrade and rollback: the last Bun mantad, built from a main commit that shipped
      # it at this PROTOCOL_VERSION, beside this checkout's Node slot. Same lockfile, so its build
      # reuses this checkout's node_modules.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: runner.os == 'Linux'
        with:
          bun-version: 1.4.2
      - name: Build the last Bun mantad for the cross-runtime tests
        if: runner.os == 'Linux'
        shell: bash
        env:
          BUN_ORCAD_COMMIT: f4092c06d639ee13ad446261dcabc78b27a21fbc
        run: |
          git fetch --no-tags --depth=1 origin "$BUN_ORCAD_COMMIT"
          git worktree add --detach "$RUNNER_TEMP/bun-orcad-source" "$BUN_ORCAD_COMMIT"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/bun-orcad-source/node_modules"
          node "$RUNNER_TEMP/bun-mantad-source/config/scripts/build-mantad-bun.mjs" --out-dir "$RUNNER_TEMP/bun-orcad"
          echo "ORCA_BUN_ORCAD_SLOT=$RUNNER_TEMP/bun-orcad" >> "$GITHUB_ENV"
          echo "BUN_EXECUTABLE=$(command -v bun)" >> "$GITHUB_ENV"
      - run: pnpm test:node-server --artifact ${{ runner.os == 'Linux' && '--cross-runtime' || '' }}
      - uses: actions/setup-node@v6
        if: runner.arch == 'X64'
        with:
          node-version: '18'
      - name: Verify Node 18 loads and hands off to the pinned Node
        if: runner.arch == 'X64'
        shell: bash
        run: |
          node out/mantad/mantad.js --mantad-smoke-load-check
          node out/mantad/mantad.js --mantad-profile-state-preflight 00000000-0000-4000-8000-000000000018 | tee "$RUNNER_TEMP/preflight.json"
          node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));if(r.runtime!=='node'||!/^24\./.test(r.runtimeVersion))process.exit(1)" "$RUNNER_TEMP/preflight.json"

  linux_glibc_floor:
    needs: [changes, persistence]
    # A failed smoke already blocks qualification; missing scope still selects every platform.
    if: >-
      ${{ !cancelled() && needs.persistence.result == 'success' &&
      needs.changes.outputs.should_run != 'false' &&
      needs.changes.outputs.qualification != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    container: ubuntu:20.04
    timeout-minutes: 20
    env:
      MANTA_BACKGROUND_LAUNCH: '1'
    steps:
      - name: Install Ubuntu 20.04 prerequisites
        run: apt-get update && apt-get install -y build-essential ca-certificates git python3 unzip
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/install-node-dependencies
      - name: Build and smoke this runner's node-pty prebuild slot under the pinned Node
        run: |
          pnpm build:mantad-prebuilds
          pnpm build:mantad-prebuilds --require-slots "$(node config/scripts/build-mantad-prebuilds.mjs --print-slot)"
          pnpm build:mantad-prebuilds --smoke
      - run: pnpm build:mantad
      - run: pnpm test:node-server --artifact

  linux_musl:
    needs: [changes, persistence]
    # A failed smoke already blocks qualification; missing scope still selects every platform.
    if: >-
      ${{ !cancelled() && needs.persistence.result == 'success' &&
      needs.changes.outputs.should_run != 'false' &&
      needs.changes.outputs.qualification != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MANTA_BACKGROUND_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify native Alpine artifact and persistence
        run: |
          # Multi-arch index digest of the tag; re-resolve it whenever NODE_RUNTIME_PIN moves.
          docker run --rm --init -i \
            -e MANTA_BACKGROUND_LAUNCH=1 \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1 sh -s <<'NODE_SERVER_QUALIFICATION'
          set -eu
          apk add --no-cache bash git libstdc++ python3 make g++
          git config --global --add safe.directory /work
          npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build:mantad-prebuilds
          pnpm build:mantad-prebuilds --require-slots "$(node config/scripts/build-mantad-prebuilds.mjs --print-slot)"
          pnpm build:mantad-prebuilds --smoke
          pnpm build:mantad
          pnpm test:node-server --artifact
          NODE_SERVER_QUALIFICATION
