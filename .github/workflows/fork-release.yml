name: Release

run-name: Release ${{ github.ref_name }}

# The fork's own release path. Deliberately not release-cut.yml: that workflow
# is built around SignPath's two-round Windows signing with hours of approval
# waits, a GitHub App that belongs to upstream, and Blacksmith runners this fork
# does not have. None of that applies here, and none of it is worth emulating.
#
# What this does instead:
#   - macOS is signed with the fork's own Developer ID and notarized.
#   - Windows ships unsigned. See "no Windows certificate" below — it is a
#     supported configuration, not a degradation, but it has one consequence.
#   - Both legs upload into one draft release, which a final job publishes only
#     after every leg has succeeded. A half-uploaded release is never visible.
#
# Cutting a release:
#   1. Bump `version` in package.json and push it.
#   2. git tag v1.2.3 && git push origin v1.2.3
#
# The tag must match package.json exactly. They disagree only by mistake, and
# the mistake is expensive: electron-updater compares the version inside the
# artifact, so a tag that says one thing and an app that says another produces
# an update that installs and then offers itself again forever.
#
# Rebuilding a tag whose draft is still open — the --ref is not optional, and it
# is not decoration. It is what makes the run a tag run, which is the only thing
# the Apple credentials' environment will admit (see `environment:` on macos):
#
#   gh workflow run Release --repo paidaxingyo666/Manta --ref refs/tags/v1.5.0
#
# There is deliberately no `tag` input. One would let a dispatch from a branch
# look correct — prepare resolves, Windows builds for forty minutes — and then
# die at the environment gate with nothing published. The ref is the tag, and
# there is one way to say so.
#
# Note that a dispatch runs the workflow file as it was at that tag, not as it
# is on main. A tag cut before this file existed cannot be rebuilt this way.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  prepare:
    if: github.repository == 'paidaxingyo666/Manta'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      # Before the checkout, because the checkout is what fails badly. Dispatched
      # from a branch, RELEASE_TAG is that branch's name, and `ref: refs/tags/main`
      # is a fatal git error with no hint about what was actually wrong.
      - name: Check the ref is a release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            echo "::error::This must run on a tag. Dispatch with --ref refs/tags/<tag>."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Tag $RELEASE_TAG is not vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ github.ref_name }}

      - name: Resolve and check the version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="${tag#v}"
          packaged="$(node -p "require('./package.json').version")"
          if [[ "$version" != "$packaged" ]]; then
            echo "::error::Tag $tag does not match package.json ($packaged). Bump package.json, push it, then retag."
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          # An -rc tag is a prerelease; electron-updater keeps the two channels
          # apart by version string, so this only affects what GitHub shows.
          if [[ "$tag" == *-rc.* ]]; then
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Open the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if state="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            # Refusing here is the whole point of checking this early. Further
            # down, the mac leg would spend an hour rebuilding and then overwrite
            # the assets of a release people can already download, and only after
            # that notice it was published. Cut a new tag instead.
            if [[ "$state" != "true" ]]; then
              echo "::error::Release $RELEASE_TAG is already published. Cut a new tag rather than rebuilding this one."
              exit 1
            fi
            echo "Draft for $RELEASE_TAG already exists; reusing it."
            exit 0
          fi
          # Generated notes need a previous release to diff against. On the very
          # first one there is none, and GitHub walks back to the root commit —
          # nine thousand of them, against a 125000-character body limit.
          notes=(--generate-notes)
          if [[ -z "$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[].tagName')" ]]; then
            notes=(--notes "First Manta release.")
          fi
          # Draft, always: electron-builder uploads asset by asset, and a
          # visible release with three of five files is worse than no release.
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Manta $RELEASE_TAG" \
            --draft \
            "${notes[@]}"

  macos:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 120
    # The Apple credentials live here, not in repository secrets, and this
    # environment admits only refs matching the tag pattern `v*`. That is what
    # stops a scheduled or branch-triggered run from ever reaching them —
    # including one of upstream's dev-channel workflows if someone were to
    # repoint it at this fork. There is no reviewer and no wait timer, so a real
    # release pays nothing for it; a run from anywhere but a `v*` tag simply
    # cannot read the secrets.
    environment: apple-signing
    env:
      # Vite's web build crossed Node's default old-space ceiling on a macOS
      # release runner once and left the release an incomplete draft.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-mac-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-mac-

      # electron's postinstall pulls its binary from GitHub release assets, and
      # that CDN returns the occasional 504. Retrying beats failing a release.
      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      # Fails before the twenty minutes of packaging rather than after, and
      # before an unsigned app can look like a successful release.
      - name: Verify signing environment
        run: node config/scripts/verify-macos-release-env.mjs
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # `plutil -lint` accepts duplicate plist keys; codesign rejects duplicate
      # entitlements, and only after the app is built.
      - name: Verify entitlements
        run: pnpm verify:macos-entitlements

      # MANTA_BUILD_IDENTITY is deliberately unset. It is the telemetry
      # transport gate, and the PostHog project behind it is upstream's — a
      # fork that set it would ship its users' events to someone else.
      - name: Build app
        run: pnpm build:release

      - name: Gate runtime file-watcher process isolation
        run: |
          node config/scripts/runtime-file-watcher-fault-harness.mjs
          ELECTRON_RUN_AS_NODE=1 pnpm exec electron config/scripts/runtime-file-watcher-fault-harness.mjs

      - name: Gate SSH relay watcher process isolation
        run: node config/scripts/relay-watcher-fault-harness.mjs

      # Notarization is a round trip to Apple and occasionally just stalls.
      - name: Package, sign, notarize and upload
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_wait_seconds: 30
          command: node config/scripts/ensure-native-runtime.mjs --runtime=electron && MANTA_MAC_RELEASE=1 pnpm exec electron-builder --config config/electron-builder.config.cjs --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify the release is still a draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [[ "$draft" != "true" ]]; then
            echo "::error::Release $RELEASE_TAG went public during the macOS upload."
            exit 1
          fi

  windows:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      # No Windows certificate. This is what makes that safe: electron-updater
      # Authenticode-verifies every installer it downloads against the
      # publisherName recorded in the *installed* app's app-update.yml, and
      # skips verification entirely when that name is absent. Setting it here
      # would make every installed copy reject its own next update, permanently
      # — so the config omits it under this flag. The one real consequence is
      # that the first install must be run by hand past SmartScreen; every
      # update after that goes through the in-app updater.
      MANTA_WIN_UNSIGNED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-win-

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build:release

      - name: Package and upload
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 45
          max_attempts: 3
          retry_wait_seconds: 30
          command: node config/scripts/ensure-native-runtime.mjs --runtime=electron && pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [prepare, macos, windows]
    runs-on: ubuntu-latest
    steps:
      # Only now, with every platform's assets in place, does the release stop
      # being a draft.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" \
            --draft=false \
            --prerelease="${{ needs.prepare.outputs.prerelease }}" \
            --latest="${{ needs.prepare.outputs.prerelease == 'false' }}"
