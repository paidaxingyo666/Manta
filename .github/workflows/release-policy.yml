name: Release Policy

on:
  release:
    types:
      - published
      - edited

permissions:
  contents: write

concurrency:
  group: release-policy
  cancel-in-progress: false

jobs:
  enforce:
    # Left pointing at upstream on purpose, and disabled at the GitHub level too.
    # This fires on `release: published`, and what it does to a release it does
    # not recognise is delete it — the release and its tag both. The rule it
    # enforces is `author === "github-actions[bot]"`, which polices a repo where
    # several people can publish. Here there is one person, and the release he
    # would most plausibly make by hand — a hotfix drafted in the web UI — is
    # exactly the shape this deletes.
    if: github.repository == 'stablyai/orca'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      # Why: release events run this file from the tagged commit, so load the module from the same commit.
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            config/scripts/release-policy.mjs
            config/scripts/release-tag-patterns.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Enforce release policy
        uses: actions/github-script@v8
        with:
          script: |
            const { pathToFileURL } = await import("node:url")
            const { enforceReleasePolicy } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/config/scripts/release-policy.mjs`).href
            )
            await enforceReleasePolicy({ github, context, core })
