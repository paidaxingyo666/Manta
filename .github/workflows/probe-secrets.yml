name: Probe secrets
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Shape check
        env:
          DH: ${{ secrets.DOCKERHUB_REPO }}
          AR: ${{ secrets.ALIYUN_REGISTRY }}
          AP: ${{ secrets.ALIYUN_REPO }}
        run: |
          # Never echo the values; only their shape.
          shape() {
            printf '%s: len=%s slashes=%s trailing_slash=%s has_scheme=%s has_space=%s\n' \
              "$1" "${#2}" "$(printf '%s' "$2" | tr -cd '/' | wc -c | tr -d ' ')" \
              "$(case "$2" in */) echo yes;; *) echo no;; esac)" \
              "$(case "$2" in http*) echo yes;; *) echo no;; esac)" \
              "$(case "$2" in *\ *) echo yes;; *) echo no;; esac)"
          }
          shape DOCKERHUB_REPO "$DH"
          shape ALIYUN_REGISTRY "$AR"
          shape ALIYUN_REPO "$AP"
